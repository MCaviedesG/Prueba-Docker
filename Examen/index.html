<!DOCTYPE html>
<html >
<head>
    
    <title>Examen</title>
</head>
<body>
    <h2>Registro de Productos</h2>
    <form action="/guardar" method="POST">
        <label>Nombre Producto:</label><br>
        <input type="text" name="nombre" placeholder="Nombre Producto" required><br><br>
        
        <label>Categoría:</label><br>
        <input type="text" name="categoria" placeholder="Categoria" required><br><br>
        
        <label>Precio:</label><br>
        <input type="number" step="0.01" name="precio" placeholder="Precio" required><br><br>
        
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
